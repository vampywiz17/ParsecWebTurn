[package]
name = "parsec-web-turn"
version = "0.8.0"
edition = "2021"
rust-version = "1.90"
publish = false

# Independent crate: neither Tauri nor WebView2 is linked.
[features]
default = []
diagnostics = ["dep:log", "dep:rcgen", "dep:ring", "dep:rustls", "dep:tokio-rustls", "wasmtime/wat"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
bytes = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rcgen = { version = "0.13", optional = true }
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
webrtc = "=0.14.0"
glow = "=0.16.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = { version = "0.4", optional = true }
libopus_sys = { version = "=0.3.3", features = ["bundled", "static"] }
ring = { version = "0.17", optional = true }
wasmtime = { version = "38", default-features = false, features = ["std", "runtime", "cranelift", "threads"] }

# Unit tests also exercise the diagnostic helpers without requiring a CLI build.
[dev-dependencies]
log = "0.4"
rcgen = "0.13"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
wasmtime = { version = "38", default-features = false, features = ["wat"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_System_Threading", "Win32_System_Performance", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

# Isolated, documented SCTP-only correction; defaults preserve upstream RTP behavior.
[patch.crates-io]
webrtc = { path = "vendor/webrtc-0.14.0" }
webrtc-ice = { path = "vendor/webrtc-ice-0.14.0" }
turn = { path = "vendor/turn-0.11.0" }
