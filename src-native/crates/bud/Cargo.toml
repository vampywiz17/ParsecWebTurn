[package]
name = "evoparseq-bud"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["vendor/lowlat-client", "vendor/lowlat-net", "vendor/lowlat-core", "vendor/lowlat-common"]
resolver = "2"

[features]
native-core = ["lowlat-client/cursor-cache"]

# Transport only: no SDK decoder, exporter or GPU probe dependency.
[dependencies]
anyhow = "1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "time"] }
lowlat-client = { path = "vendor/lowlat-client", features = ["external-video", "turn-stream", "usb-hid-input"] }
lowlat-core = { path = "vendor/lowlat-core" }
lowlat-crypto = { git = "https://github.com/nomi-san/lowlat", rev = "5f8db5689e55de0d396b0520824caa9fc053dd86" }

[dev-dependencies]
lowlat-net = { path = "vendor/lowlat-net", features = ["turn-stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[patch."https://github.com/nomi-san/lowlat"]
lowlat-core = { path = "vendor/lowlat-core" }
lowlat-common = { path = "vendor/lowlat-common" }
