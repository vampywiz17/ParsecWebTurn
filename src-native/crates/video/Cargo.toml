[package]
name = "evoparseq-video"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
self_cell = "=1.3.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_CompositionSwapchain", "Win32_Graphics_DirectComposition", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_Security", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
lowlat-drivers = { git = "https://github.com/nomi-san/lowlat", rev = "5f8db5689e55de0d396b0520824caa9fc053dd86" }
lowlat-decode = { git = "https://github.com/nomi-san/lowlat", rev = "5f8db5689e55de0d396b0520824caa9fc053dd86" }

[patch."https://github.com/nomi-san/lowlat"]
lowlat-drivers = { path = "../../vendor/lowlat-drivers" }
