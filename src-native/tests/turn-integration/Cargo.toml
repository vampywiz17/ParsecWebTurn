[package]
name = "evoparseq-turn-integration"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dev-dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webrtc = "=0.14.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
bytes = "1"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[patch.crates-io]
dtls = { path = "../../vendor/dtls-0.13.0" }
webrtc = { path = "../../vendor/webrtc-0.14.0" }
webrtc-ice = { path = "../../vendor/webrtc-ice-0.14.0" }
turn = { path = "../../vendor/turn-0.11.0" }
