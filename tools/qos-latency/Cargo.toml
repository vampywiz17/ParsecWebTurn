[package]
name = "evoparseq-qos-test"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
getrandom = "0.3"
rcgen = "0.13"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_Networking_WinSock"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"
