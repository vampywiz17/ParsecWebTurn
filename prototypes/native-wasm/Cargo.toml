[package]
name = "parsec-native-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

# Independent crate: neither Tauri nor WebView2 is linked.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
wasmtime = { version = "38", default-features = false, features = ["std", "runtime", "cranelift", "threads", "wat"] }

[profile.release]
strip = true

