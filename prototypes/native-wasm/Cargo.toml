[package]
name = "parsec-native-wasm"
version = "0.14.18"
edition = "2021"
rust-version = "1.90"
publish = false

# Independent crate: neither Tauri nor WebView2 is linked.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
webrtc = "=0.14.0"
glow = "=0.16.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
ring = "0.17"
wasmtime = { version = "38", default-features = false, features = ["std", "runtime", "cranelift", "threads", "wat"] }

[profile.release]
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_System_Power", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell"] }

# Isolated, documented SCTP-only correction; defaults preserve upstream RTP behavior.
[patch.crates-io]
webrtc = { path = "vendor/webrtc-0.14.0" }
