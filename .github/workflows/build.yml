name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate, build and package
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ParsecWebTurn-win64
          path: |
            ParsecWebTurn.exe
            dist/ParsecWebTurn-v*-win64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
