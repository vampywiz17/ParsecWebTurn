name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate, build and package
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ParsecWebTurn-win64
          path: |
            ParsecWebTurn.exe
            dist/ParsecWebTurn-v*-win64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Native WebView2 smoke test
        shell: pwsh
        run: node scripts/smoke-webview.cjs
