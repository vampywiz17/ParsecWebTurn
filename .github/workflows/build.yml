name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ParsecWebTurn.exe ./src

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\ParsecWebTurn | Out-Null
          Copy-Item ParsecWebTurn.exe dist\ParsecWebTurn\
          Copy-Item ice.example.json dist\ParsecWebTurn\
          Copy-Item -Recurse extension dist\ParsecWebTurn\extension
          Copy-Item README.md dist\ParsecWebTurn\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParsecWebTurn-win64
          path: dist/ParsecWebTurn
