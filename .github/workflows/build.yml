name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Prepare Parsec icon resource
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path assets | Out-Null

          $haveSvg = $false
          try {
            Invoke-WebRequest "https://www.svgrepo.com/show/331528/parsec.svg" -OutFile "assets/parsec.svg" -Headers @{ "User-Agent" = "Mozilla/5.0" }
            $head = Get-Content "assets/parsec.svg" -Raw
            if ($head -match "<svg") { $haveSvg = $true }
          } catch {
            Write-Host "SVG Repo download failed, using official Parsec favicon fallback."
          }

          if ($haveSvg) {
            choco install imagemagick -y --no-progress
            magick "assets/parsec.svg" -background none -define icon:auto-resize=256,128,64,48,32,16 "assets/parsec.ico"
          } else {
            Invoke-WebRequest "https://parsec.app/favicon.ico" -OutFile "assets/parsec.ico"
          }

          go install github.com/akavel/rsrc@latest
          & "$(go env GOPATH)\bin\rsrc.exe" -arch amd64 -ico "assets/parsec.ico" -o "src/rsrc.syso"

      - name: Build
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ParsecWebTurn.exe ./src

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\ParsecWebTurn | Out-Null
          Copy-Item ParsecWebTurn.exe dist\ParsecWebTurn\
          Copy-Item ice.example.json dist\ParsecWebTurn\
          Copy-Item -Recurse extension dist\ParsecWebTurn\extension
          Copy-Item README.md dist\ParsecWebTurn\
          Copy-Item LICENSE dist\ParsecWebTurn\
          if (Test-Path CHANGELOG.md) { Copy-Item CHANGELOG.md dist\ParsecWebTurn\ }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParsecWebTurn-win64
          path: dist/ParsecWebTurn
