name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw 'Tag does not match VERSION' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate, build and package
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Native WebView2 smoke test
        shell: pwsh
        run: node scripts/smoke-webview.cjs
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag ParsecWebTurn.exe "dist/ParsecWebTurn-$tag-win64.zip" dist/SHA256SUMS.txt --verify-tag --title "ParsecWebTurn $tag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
