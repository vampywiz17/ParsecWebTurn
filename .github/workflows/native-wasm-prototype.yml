name: Native WASM prototype

on:
  workflow_dispatch:
  push:
    branches: [codex/native-wasm-prototype]
    paths:
      - 'prototypes/native-wasm/**'
      - '.github/workflows/native-wasm-prototype.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prototypes/native-wasm
          cache-on-failure: true
      - name: Build diagnostic executable for local GPU feedback
        shell: pwsh
        run: |
          cargo build --locked --manifest-path prototypes/native-wasm/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Native-WASM-prototype-debug-win64
          path: prototypes/native-wasm/target/debug/parsec-native-wasm.exe
          if-no-files-found: error
      - name: Validate and build independent Rust host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --manifest-path prototypes/native-wasm/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo test --locked --manifest-path prototypes/native-wasm/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cargo clippy --locked --manifest-path prototypes/native-wasm/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo build --locked --release --manifest-path prototypes/native-wasm/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Run original Parsec WASM without a browser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./prototypes/native-wasm/fetch-core.ps1
          $artifact = 'prototypes/native-wasm/artifacts'
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null
          $exe = 'prototypes/native-wasm/target/release/parsec-native-wasm.exe'
          $core = 'prototypes/native-wasm/vendor/parsecd.wasm'
          foreach ($mode in @('inspect', 'allocator', 'boot')) {
            & $exe $mode $core "$artifact/$mode.json" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "WASM $mode failed" }
          }
          $allocator = Get-Content "$artifact/allocator.json" -Raw | ConvertFrom-Json
          if (!$allocator.instantiated -or !$allocator.allocator_roundtrip) { throw 'Actual guest allocator not verified' }
          $boot = Get-Content "$artifact/boot.json" -Raw | ConvertFrom-Json
          if (!$boot.instantiated -or $boot.video_rendered -or $boot.network_enabled) { throw 'Incorrect bootstrap status' }
          if (!$boot.native_backend.initialized -or $boot.host.boundary -eq 'env::parsec_web_init') { throw 'The pinned core did not initialize the native client backend' }
          $boundaries = @($boot.host.boundary) + @($boot.threads | ForEach-Object { $_.boundary })
          if (!$boot.start_error -or !($boundaries -contains 'env::web_run_and_yield' -or $boundaries -contains 'env::web_set_gfx')) { throw 'The pinned core did not reach its native event-loop/graphics boundary' }
          & $exe transport-probe "$artifact/transport.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native WebRTC transport failed' }
          $transport = Get-Content "$artifact/transport.json" -Raw | ConvertFrom-Json
          if (!$transport.srtp_profiles_verified -or $transport.connected_peers -ne 2 -or $transport.binary_messages_verified -ne 6 -or !$transport.peers_closed) { throw 'Native data-channel exchange or cleanup not verified' }
          & $exe signaling-probe "$artifact/signaling.json"
          if ($LASTEXITCODE -ne 0) { throw 'Compact Parsec signaling adapter failed' }
          $signaling = Get-Content "$artifact/signaling.json" -Raw | ConvertFrom-Json
          if ($signaling.connected_peers -ne 2 -or $signaling.binary_messages_verified -ne 6 -or !$signaling.peers_closed -or $signaling.compact_candidates_added -lt 1 -or $signaling.parsec_host_connected) { throw 'Incorrect compact signaling proof' }
          & $exe guest-offer-probe "$artifact/guest-offer.json"
          if ($LASTEXITCODE -ne 0) { throw 'Actual native guest offer import failed' }
          $offer = Get-Content "$artifact/guest-offer.json" -Raw | ConvertFrom-Json
          if (!$offer.host_wait_import_verified -or !$offer.guest_completion_verified -or !$offer.credentials_validated -or !$offer.native_attempt.peer_closed -or !$offer.native_attempt.worker_finished -or $offer.parsec_host_connected) { throw 'Incorrect guest/native offer proof' }
          & $exe guest-session-probe "$artifact/guest-session.json"
          if ($LASTEXITCODE -ne 0) { throw 'Guest/native ICE/DTLS/SCTP exchange failed' }
          $session = Get-Content "$artifact/guest-session.json" -Raw | ConvertFrom-Json
          if (!$session.sctp_without_srtp_verified) { throw 'SCTP-only DTLS was not verified' }
          if (!$session.parsec_padded_ufrag_native_negotiation_verified) { throw 'Padded Parsec ufrag authentication was not verified' }
          if (!$session.live_attempt_reporting_verified) { throw 'Live native transport reporting was not verified' }
          & $exe guest-dtls-failure-probe "$artifact/guest-dtls-failure.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native DTLS failure diagnostic failed' }
          $failure = Get-Content "$artifact/guest-dtls-failure.json" -Raw | ConvertFrom-Json
          if (!$failure.library_failure_classification_verified -or !$failure.signature_algorithm_reporting_verified -or !$failure.fingerprint_rejection_verified -or !$failure.peers_closed) { throw 'Actual DTLS diagnostic capture was not verified' }
          & $exe guest-legacy-dtls-failure-probe "$artifact/guest-legacy-dtls-failure.json"
          if ($LASTEXITCODE -ne 0) { throw 'Legacy compatibility fingerprint rejection failed' }
          $legacyFailure = Get-Content "$artifact/guest-legacy-dtls-failure.json" -Raw | ConvertFrom-Json
          if (!$legacyFailure.legacy_rsa_1024_enabled -or !$legacyFailure.fingerprint_rejection_verified -or !$legacyFailure.peers_closed) { throw 'Legacy mode must preserve fingerprint verification' }
          if (!$session.guest_begin_and_candidate_verified -or !$session.guest_buffer_retry_verified -or !$session.guest_sync_ack_verified -or $session.guest_local_candidate_events -lt 1 -or $session.connected_peers -ne 2 -or $session.binary_messages_verified -ne 6 -or !$session.peers_closed -or $session.native_connected.channels_open -ne 3 -or $session.parsec_host_connected) { throw 'Incorrect guest/native session proof' }
          & $exe guest-control-probe "$artifact/guest-control.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native Parsec control framing/imports failed' }
          $control = Get-Content "$artifact/guest-control.json" -Raw | ConvertFrom-Json
          if (!$control.control.startup_configuration_verified -or !$control.control.wasm_input_packet_verified -or !$control.control.status_events_verified -or !$control.control.guest_self_metadata_verified -or !$control.control.encode_latency_verified -or $control.control.host_frames_verified -ne 6 -or !$control.peers_closed -or $control.parsec_host_connected) { throw 'Incorrect native control proof' }
          & $exe guest-buffer-probe "$artifact/guest-buffer.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native cursor/user-data guest buffers failed' }
          $buffer = Get-Content "$artifact/guest-buffer.json" -Raw | ConvertFrom-Json
          if (!$buffer.buffers.cursor_payload_verified -or !$buffer.buffers.binary_user_data_verified -or !$buffer.buffers.empty_user_data_verified -or !$buffer.buffers.failed_copy_retry_verified -or !$buffer.buffers.one_shot_consumption_verified -or !$buffer.buffers.unicode_outbound_verified -or !$buffer.buffers.disconnect_cleanup_verified -or !$buffer.peers_closed -or $buffer.parsec_host_connected -or $buffer.buffers.cursor_rendered) { throw 'Incorrect guest buffer proof' }
          & $exe guest-http-probe "$artifact/guest-http.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native guest HTTP import failed' }
          $http = Get-Content "$artifact/guest-http.json" -Raw | ConvertFrom-Json
          if ($http.requests_verified -ne 9 -or !$http.binary_response_verified -or !$http.body_read_timeout_verified -or !$http.allocation_failure_cleanup_verified -or !$http.redirect_not_followed_verified -or !$http.offline_policy_verified -or !$http.server_closed -or $http.authentication_integrated -or $http.external_requests_enabled) { throw 'Incorrect guest HTTP proof' }
          & $exe guest-websocket-probe "$artifact/guest-websocket.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native guest WebSocket imports failed' }
          $websocket = Get-Content "$artifact/guest-websocket.json" -Raw | ConvertFrom-Json
          if ($websocket.fixture_connections_verified -ne 4 -or !$websocket.unicode_roundtrip_verified -or !$websocket.rfc_ping_pong_verified -or !$websocket.application_keepalive_verified -or !$websocket.destroy_cleanup_verified -or !$websocket.upgrade_failure_verified -or !$websocket.message_limit_verified -or !$websocket.server_closed -or $websocket.authentication_integrated -or $websocket.external_requests_enabled) { throw 'Incorrect guest WebSocket proof' }
          $boot.host | ConvertTo-Json -Depth 5
          $boot.threads | ConvertTo-Json -Depth 5
          $boot.start_error
          Copy-Item -LiteralPath $exe -Destination "$artifact/parsec-native-wasm.exe"
          & $exe guest-tls-probe "$artifact/guest-tls.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native guest HTTPS/WSS imports failed' }
          $tls = Get-Content "$artifact/guest-tls.json" -Raw | ConvertFrom-Json
          if ($tls.tls_connections_verified -ne 6 -or $tls.certificate_rejections_verified -ne 4 -or !$tls.https_import_verified -or !$tls.wss_import_verified -or !$tls.hostname_mismatch_rejected_verified -or !$tls.untrusted_certificate_rejected_verified -or !$tls.servers_closed -or $tls.certificate_verification_disabled -or $tls.external_requests_enabled -or $tls.authentication_integrated) { throw 'Incorrect guest TLS proof' }
          Copy-Item -LiteralPath prototypes/native-wasm/README.md -Destination "$artifact/README.md"
          & $exe guest-thread-probe "$artifact/guest-thread.json"
          if ($LASTEXITCODE -ne 0) { throw 'Guest thread lifecycle failed' }
          $thread = Get-Content "$artifact/guest-thread.json" -Raw | ConvertFrom-Json
          if ($thread.sequential_guest_workers_verified -ne 80 -or $thread.completed_guest_workers_verified -ne 97 -or !$thread.concurrent_limit_verified -or !$thread.capacity_released_verified -or !$thread.bounded_history_verified -or !$thread.numeric_guest_exit_code_verified -or $thread.external_requests_enabled -or $thread.real_account_used) { throw 'Incorrect guest thread lifecycle proof' }
          & $exe guest-audit-probe "$artifact/guest-audit.json"
          if ($LASTEXITCODE -ne 0) { throw 'Shared guest network audit failed' }
          $audit = Get-Content "$artifact/guest-audit.json" -Raw | ConvertFrom-Json
          if ($audit.guest_instances_verified -ne 2 -or $audit.intents_verified -ne 2 -or !$audit.shared_audit_verified -or !$audit.offline_failure_outputs_verified -or !$audit.request_redaction_verified -or !$audit.stdout_redaction_verified -or $audit.external_requests_enabled -or $audit.authentication_integrated) { throw 'Incorrect guest audit proof' }
          Copy-Item -LiteralPath prototypes/native-wasm/Cargo.lock -Destination "$artifact/Cargo.lock"
          & $exe guest-audio-unavailable-probe "$artifact/guest-audio-unavailable.json"
          if ($LASTEXITCODE -ne 0) { throw 'Audio-unavailable guest contract failed' }
          $audio = Get-Content "$artifact/guest-audio-unavailable.json" -Raw | ConvertFrom-Json
          if (!$audio.null_factory_result_verified -or !$audio.guest_continues_verified -or !$audio.fabricated_context_rejected -or $audio.audio_played -or $audio.device_opened) { throw 'Audio unavailability must not impersonate a renderer' }
          & $exe guest-platform-probe "$artifact/guest-platform.json"
          if ($LASTEXITCODE -ne 0) { throw 'Guest local desktop imports failed' }
          $platform = Get-Content "$artifact/guest-platform.json" -Raw | ConvertFrom-Json
          if (!$platform.unicode_clipboard_imports_verified -or !$platform.guest_owned_clipboard_buffers_verified -or !$platform.https_link_import_verified -or !$platform.unsafe_link_rejected_verified -or !$platform.alert_import_verified -or !$platform.forward_key_alias_verified -or !$platform.disabled_clipboard_verified -or $platform.real_clipboard_accessed -or $platform.browser_launched -or $platform.external_requests_enabled -or $platform.real_account_used) { throw 'Incorrect desktop import proof' }
          & $exe guest-window-probe "$artifact/guest-window.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native fullscreen bridge failed' }
          $window = Get-Content "$artifact/guest-window.json" -Raw | ConvertFrom-Json
          if ($window.fullscreen_roundtrips -ne 5 -or !$window.native_geometry_restored -or !$window.native_style_restored -or !$window.idempotent_requests_verified -or !$window.guest_import_verified -or $window.real_account_used -or $window.parsec_host_connected) { throw 'Incorrect fullscreen proof' }
      - uses: actions/upload-artifact@v4
        with:
          name: Native-WASM-prototype-win64
          path: prototypes/native-wasm/artifacts/
          if-no-files-found: error
