name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Before reporting
      description: Search [open and closed issues](https://github.com/vampywiz17/ParsecWebTurn/issues?q=is%3Aissue) first.
      options:
        - label: I checked that this bug has not already been reported.
          required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Copy the version from About. For a test build, include its commit if known.
      placeholder: Stable/dev version or test-build commit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem, what you expected, and how to reproduce it. If it happens only sometimes, mention that.
      placeholder: |
        Steps to reproduce:
        1.
        2.

        Expected:
        Actual (including any error message):
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup (optional)
      description: Share what you know; leave out anything unrelated or unknown.
      placeholder: |
        Windows version and GPU:
        WebRTC or BUD; direct or TURN:
        Relevant settings (codec, Zero copy, HID, etc.):
  - type: textarea
    id: logs
    attributes:
      label: client-events.jsonl (required)
      description: |
        1. Open **Settings > Network**. Under **Event log**, check **Enable event logging**, then click **Save settings**.
        2. Reproduce the problem with logging enabled.
        3. Find **client-events.jsonl** in the same folder as **settings.json** (normally beside **EvoParseq.exe**, or **ParsecWebTurn.exe** for the older client). If you use `--data-dir`, look in that folder instead.
        4. Drag the complete log file into this field. If GitHub rejects `.jsonl`, upload a `.txt` copy or put it in a ZIP. A screenshot or a single error line does not replace the log.

        Remove secrets and personal information; **do not upload settings.json**. If the app cannot start or no log is created, explain that here and include the exact error message.
      placeholder: Attach client-events.jsonl here, or explain why the app could not create a log.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Add screenshots if they help explain the problem. Screenshots do not replace the required log.
      placeholder: Drag screenshots here.
