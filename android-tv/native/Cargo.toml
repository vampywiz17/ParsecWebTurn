[package]
name = "evoparseq-tv"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
rust-version = "1.90"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
serde_json = "1.0.154"
serde = { version = "1", features = ["derive"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
bytes = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "net"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
webrtc = "=0.14.0"
libopus_sys = { version = "=0.3.3", features = ["bundled", "static"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", default-features = false }
ndk-sys = { version = "0.6", features = ["media", "audio"] }

[patch.crates-io]
dtls = { path = "../../src-native/vendor/dtls-0.13.0" }
webrtc = { path = "../../src-native/vendor/webrtc-0.14.0" }
webrtc-ice = { path = "../../src-native/vendor/webrtc-ice-0.14.0" }
turn = { path = "../../src-native/vendor/turn-0.11.0" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "s"
